name: RHEO Production CI/CD Pipeline

on:
  push:
    branches:
      - v1
      - main

jobs:
  # ── Job 1: Build & Verify ──────────────────────────────────────
  verify:
    name: Verify & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci

      - name: Generate Prisma Client
        run: |
          cd server
          npx prisma generate

      - name: Install Client Dependencies & Test Build
        run: |
          cd client
          npm ci
          npm run build

  # ── Job 2: Build & Push Docker Image to Docker Hub (Optional) ──
  docker-hub:
    name: Build & Push Docker Image to Docker Hub
    needs: verify
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/v1' || github.ref == 'refs/heads/main')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub (if credentials provided)
        if: secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Server Image
        if: secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != ''
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/rheo-server:latest
            ${{ secrets.DOCKER_USERNAME }}/rheo-server:${{ github.sha }}

  # ── Job 3: Deploy Backend to AWS EC2 ───────────────────────────
  deploy-backend:
    name: Deploy Backend to AWS EC2
    needs: [verify, docker-hub]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/v1' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Remote SSH Commands on AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/Rheo || cd ~/Rheo
            git fetch origin
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}
            
            # Pull latest pre-built images if using Docker Hub, or build locally
            if [ -n "${{ secrets.DOCKER_USERNAME }}" ]; then
              docker pull ${{ secrets.DOCKER_USERNAME }}/rheo-server:latest || true
            fi
            
            docker-compose -f docker-compose.prod.yml down --remove-orphans || true
            docker-compose -f docker-compose.prod.yml up -d --build
            docker image prune -f

  # ── Job 4: Deploy Frontend to Vercel ───────────────────────────
  deploy-frontend:
    name: Deploy Frontend to Vercel
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/v1' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Vercel Production
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./client
